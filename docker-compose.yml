services:

  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

  productor:
    build: .
    container_name: php-productor
    depends_on:
      - rabbitmq
    command: php productor/productor.php

  consumidor:
    build: .
    container_name: php-consumidor
    depends_on:
      - rabbitmq
    command: php consumidor/consumidor.php